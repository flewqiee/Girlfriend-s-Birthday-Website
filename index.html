<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sana Özel Bir Şey</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap');


*{
    box-sizing:border-box;
}


body{
    margin:0;
    overflow:hidden;
    background:#17141b;
    font-family:"Gochi Hand", cursive;
}


/* ANA SAHNE */

.room{
    width:100vw;
    height:100vh;
    position:relative;
    background:
    radial-gradient(circle at 70% 40%, #57453b, #17141b 65%);
    overflow:hidden;
}


/* AYDINLATMA */

.lamp-light{

    position:absolute;
    width:600px;
    height:600px;

    background:
    radial-gradient(
    circle,
    rgba(255,205,140,.35),
    transparent 65%
    );

    right:10%;
    top:10%;

}



/* PENCERE */


.window{

    position:absolute;
    width:260px;
    height:200px;

    right:80px;
    top:70px;

    background:#20283b;

    border:8px solid #342b2c;

    box-shadow:
    0 0 40px rgba(100,120,200,.2);

}


.moon{

    position:absolute;

    width:60px;
    height:60px;

    border-radius:50%;

    background:#fff3c7;

    right:50px;
    top:35px;

}


/* YILDIZLAR */


.star{

position:absolute;
color:#ffe8a6;
animation:blink 3s infinite;

}


@keyframes blink{

50%{
opacity:.3;
}

}



/* MASA */


.desk{

position:absolute;

bottom:100px;
left:10%;

width:520px;
height:180px;

background:#4a3328;

border-radius:20px;

transform:rotate(-1deg);

box-shadow:
0 20px 40px #0008;

}



/* OBJELER */


.cup{

position:absolute;

left:70px;
top:-50px;

width:80px;
height:70px;

background:#e8d6c4;

border-radius:0 0 30px 30px;

}


.paper{

position:absolute;

left:190px;
top:-35px;

width:120px;
height:90px;

background:#fff4df;

transform:rotate(-7deg);

}


.photo{

position:absolute;

right:70px;
top:-60px;

width:90px;
height:110px;

background:white;

transform:rotate(8deg);

}


.photo:after{

content:"♡";

font-size:50px;

position:absolute;
left:25px;
top:25px;

color:#b47777;

}



/* TELEFON */


.phone{

position:absolute;

right:160px;
bottom:140px;


width:230px;
height:420px;

background:#171515;

border-radius:35px;

padding:15px;


transform:translateY(40px);

opacity:0;


transition:1s;


box-shadow:
0 20px 50px #000;


}


.phone.show{

opacity:1;

transform:translateY(0);

}



.screen{

height:100%;

background:#fff4e8;

border-radius:25px;

padding:25px;

color:#382c2c;

}



.msg{

background:#ead8d0;

padding:10px 15px;

border-radius:15px;

margin-bottom:15px;

opacity:0;

animation:appear .7s forwards;


}



@keyframes appear{

to{
opacity:1;
}

}



/* DOSYA */


.file{

margin-top:20px;

background:#fff;

padding:15px;

border-radius:15px;

border:2px dashed #b77b7b;

text-align:center;

cursor:pointer;

}


.file:hover{

transform:rotate(-2deg) scale(1.05);

}



/* GİZEM TOZU */


.dust{

position:absolute;

width:5px;
height:5px;

background:#fff1bd;

border-radius:50%;

animation:float 8s infinite;

}



@keyframes float{

50%{
transform:translateY(-100px);
opacity:.3;
}

}



</style>

</head>


<body>


<div class="room">


<div class="lamp-light"></div>


<div class="window">

<div class="moon"></div>

</div>



<div class="star" style="top:100px;left:200px">✦</div>
<div class="star" style="top:200px;left:400px">✧</div>
<div class="star" style="top:80px;right:300px">✦</div>




<div class="desk">


<div class="cup"></div>

<div class="paper">
</div>

<div class="photo"></div>


</div>





<div class="phone" id="phone">


<div class="screen">


<h3>Umut</h3>


<div id="messages"></div>


<div class="file" onclick="openLetter()">

✦ sadece_sana.birşey ✦

<br>

açmak için dokun

</div>


</div>


</div>




</div>





<script>


const phone=document.getElementById("phone");
const messages=document.getElementById("messages");



setTimeout(()=>{


// telefon ışığı

phone.classList.add("show");


// mesajlar


let texts=[

"selam :)",

"ne yapıyorsun?",

"bir süredir bir şey hazırlıyorum",

"senin için.",

"hazır mısın?"

];


texts.forEach((t,i)=>{


setTimeout(()=>{


let div=document.createElement("div");

div.className="msg";

div.innerHTML=t;

messages.appendChild(div);


},1000*i);



});



},3000);





function openLetter(){


document.querySelector(".room").style.transition="2s";

document.querySelector(".room").style.opacity="0";

setTimeout(()=>{

alert("Burada mevcut zarf sahnesi açılacak.");

},2000);


}



</script>


</body>
</html>
