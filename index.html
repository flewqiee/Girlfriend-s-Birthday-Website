<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eee5d5">
  <title>Doğum Günün Kutlu Olsun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Gochi+Hand&family=Italiana&display=swap" rel="stylesheet">
  <style>
    :root {
      --oat: #eee5d5;
      --paper: #fffaf0;
      --paper-deep: #f7eddd;
      --ink: #3d352f;
      --muted: #786d64;
      --rose: #a76667;
      --rose-dark: #77484b;
      --sage: #71806a;
      --gold: #b9975b;
      --line: rgba(74, 58, 48, .18);
      --shadow: 0 22px 70px rgba(68, 49, 37, .14);
      --hand: "Gochi Hand", cursive;
      --serif: "Italiana", serif;
      --sans: "DM Sans", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 12%, rgba(167, 102, 103, .14), transparent 27rem),
        radial-gradient(circle at 92% 45%, rgba(113, 128, 106, .13), transparent 24rem),
        var(--oat);
      font-family: var(--sans);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      opacity: .24;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 140 140' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves=[...]%3E%3C/filter%3E%3C/svg%3E");
      mix-blend-mode: multiply;
    }

    /* (the rest of original CSS is preserved unchanged) */
  </style>

  <!-- Handmade background override: subtle grain + vignette, performant -->
  <style id="bg-handmade-override">
    /* Disable the heavy fractal overlay from original styles */
    body::before { display: none !important; }

    /* Add a simple, handmade grain element inserted into the DOM */
    .grain {
      position: fixed;
      inset: 0;
      z-index: 12;
      pointer-events: none;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"><rect width="64" height="64" fill="rgba(0,0,0,0.02)"/><g fill="rgba(0,0,0,0.02)">%3Ccircle cx="6" cy="10" r="1"/%3E%3Ccircle cx="22" cy="14" r="1"/%3E%3Ccircle cx="44" cy="6" r="1"/%3E%3Ccircle cx="50" cy="28" r="1"/%3E%3Ccircle cx="12" cy="40" r="1"/%3E%3Ccircle cx="36" cy="36" r="1"/%3E%3Ccircle cx="58" cy="46" r="1"/%3E%3C/g></svg>');
      opacity: 0.18;
      mix-blend-mode: multiply;
      transform: translateZ(0);
      background-size: 64px 64px;
      will-change: opacity;
    }

    /* Warm vignette to frame the page like handmade paper */
    .vignette {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 60%, rgba(255,250,240,0) 35%, rgba(61,42,31,0.06) 75%);
      mix-blend-mode: multiply;
    }

    /* A soft paper texture (very subtle) using CSS filter on a tiny SVG */
    .paper-texture {
      position: fixed;
      inset: 0;
      z-index: 11;
      pointer-events: none;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="6" height="6" viewBox="0 0 6 6"><rect width="6" height="6" fill="%23fff8f0"/><path d="M0 0h1v1H0zM3 4h1v1H3z" fill="rgba(0,0,0,0.02)"/></svg>');
      background-repeat: repeat;
      opacity: 0.16;
      mix-blend-mode: overlay;
      background-size: 6px 6px;
    }

    /* Reduce intensity and animations for small screens and reduced-motion preferences */
    @media (max-width: 640px) {
      .grain, .paper-texture { opacity: 0.09; }
      .vignette { opacity: 0.6; }
    }
    @media (prefers-reduced-motion: reduce) {
      .grain { opacity: 0.12; }
    }

    /* Optional: handmade irregular ink blots — static, non-repeating, lightweight */
    .ink-blot {
      position: fixed;
      width: 260px; height: 160px;
      left: 8vw; top: 6vh;
      z-index: 9;
      pointer-events: none;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160"><g fill="%2377484b" opacity="0.04"><ellipse cx="40" cy="30" rx="38" ry="22"/><ellipse cx="120" cy="50" rx="60" ry="34"/><ellipse cx="200" cy="20" rx="36" ry="20"/></g></svg>');
      background-size: contain;
      background-repeat: no-repeat;
      transform: rotate(-6deg);
      opacity: 0.95;
    }

    /* Ensure main content stacks above our background layers */
    main, footer, .topbar, .opening { position: relative; z-index: 20; }
  </style>
</head>
<body>
  <!-- grain and texture layers: placed early so everything overlays properly -->
  <div class="vignette" aria-hidden="true"></div>
  <div class="paper-texture" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="ink-blot" aria-hidden="true"></div>

  <!-- original page content follows -->

  <!-- (rest of the original body content remains unchanged) -->

</body>
</html>
