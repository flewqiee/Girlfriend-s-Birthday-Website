<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Belçim için küçük bir şey</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap');


*{
    box-sizing:border-box;
}


body{

    margin:0;
    overflow:hidden;

    background:#10131c;

    font-family:"Gochi Hand", cursive;

}


/* ANA SAHNE */

#scene{

    width:100vw;
    height:100vh;

    position:relative;

    overflow:hidden;

    transition:2s;

}



/* ODA */


.room{

    position:absolute;

    inset:0;

    background:

    linear-gradient(
        90deg,
        rgba(10,12,20,.65),
        transparent 55%
    ),

    linear-gradient(
        180deg,
        #263653,
        #171720 70%
    );


}



/* PENCERE */


.window{

    position:absolute;

    left:7%;
    top:7%;

    width:58%;
    height:48%;

    border:8px solid #272735;

    overflow:hidden;

    background:#31415f;

    box-shadow:

    inset 0 0 50px #0008;

}



/* gökyüzü */


.sky{

    position:absolute;

    inset:0;


    background:

    linear-gradient(
        #49658e,
        #202b46
    );

}



.moon{

    position:absolute;

    right:80px;
    top:45px;

    width:70px;
    height:70px;

    background:#fff1c4;

    border-radius:50%;

    box-shadow:

    0 0 40px #fff1c477;

}




/* şehir */


.city{

    position:absolute;

    bottom:0;

    width:100%;
    height:35%;


    background:

    repeating-linear-gradient(
        90deg,
        #121928 0 45px,
        #1b2438 45px 90px
    );


}



.city:after{

    content:"";

    position:absolute;

    inset:0;


    background:

    repeating-linear-gradient(
        90deg,
        transparent 0 20px,
        #ffd98a 20px 24px
    );

    opacity:.25;

}




/* PERDE */


.curtain{

    position:absolute;

    top:0;

    width:120px;
    height:60%;

    background:

    linear-gradient(
        90deg,
        #292633,
        #4a4050
    );

    opacity:.75;


    animation:sway 7s infinite ease-in-out;

}



.left{

    left:0;

}


.right{

    right:0;

}



@keyframes sway{

    50%{

        transform:translateX(8px);

    }

}




/* SICAK LAMBA */


.lamp-light{

    position:absolute;

    right:-100px;

    bottom:-120px;

    width:600px;
    height:600px;


    background:

    radial-gradient(
        circle,
        rgba(255,198,120,.35),
        transparent 65%
    );

}




/* TOZ */

.dust{

    position:absolute;

    width:5px;
    height:5px;

    border-radius:50%;

    background:#fff0c0;

    animation:float 10s infinite;

}


@keyframes float{

    50%{

        transform:
        translateY(-80px);

        opacity:.2;

    }

}




/* MASA */


.desk{


    position:absolute;

    left:8%;

    bottom:12%;


    width:450px;

    height:160px;


    background:#493228;


    border-radius:15px;


    transform:rotate(-1deg);


    box-shadow:

    0 30px 50px #0009;


}



/* MASA OBJE */

.photo{

    position:absolute;

    right:40px;

    top:-60px;


    width:90px;

    height:110px;


    background:#fff4df;


    transform:rotate(8deg);


    color:#a66;

    text-align:center;

    padding-top:35px;

    font-size:35px;


}



.cassette{

    position:absolute;

    left:80px;

    top:-40px;


    width:90px;

    height:55px;


    background:#27242a;

    color:#fff;

    text-align:center;

    padding-top:15px;


}



.note{

    position:absolute;

    left:210px;

    top:-45px;


    width:120px;

    height:90px;


    background:#fff0d8;


    transform:rotate(-7deg);


    padding:15px;

}



/* TELEFON */


#phone{


    position:absolute;


    right:8%;


    bottom:8%;


    width:310px;

    height:580px;


    background:#151515;


    border-radius:45px;


    padding:18px;


    box-shadow:

    0 40px 100px #000;


    transform:

    translateY(120%);


    transition:

    1.3s cubic-bezier(.2,.8,.2,1);


}



#phone.show{

    transform:

    translateY(0);

}



.phone-screen{


    height:100%;

    background:#f8eee4;


    border-radius:30px;


    overflow:hidden;


}



.phone-head{


    text-align:center;

    padding:20px;

    font-size:24px;

}



#messages{

    padding:15px;

}


.msg{


    background:#ead5ca;


    padding:12px 15px;


    border-radius:20px;


    margin:12px;


    opacity:0;


    animation:

    messageIn .5s forwards;


}



@keyframes messageIn{


    from{

        opacity:0;

        transform:translateY(20px);

    }


    to{

        opacity:1;

    }


}
<style>


/* DOSYA */

#file{


    margin:20px;


    padding:18px;


    background:#fff3dc;


    border-radius:18px;


    border:

    2px dashed #b47777;


    text-align:center;


    cursor:pointer;


    opacity:0;


    transform:translateY(20px);


    transition:.8s;


}



#file.show{

    opacity:1;

    transform:translateY(0);

}



#file small{


    display:block;


    margin-top:10px;


    font-size:14px;


}



/* TELEFON BİLDİRİM */

.notification{


    position:absolute;


    right:30px;

    bottom:30px;


    background:#fff4df;


    padding:12px 20px;


    border-radius:30px;


    box-shadow:0 10px 30px #0008;


    animation:ring 1s infinite;


}



@keyframes ring{


    0%{

        transform:rotate(0);

    }


    25%{

        transform:rotate(5deg);

    }


    50%{

        transform:rotate(-5deg);

    }


    100%{

        transform:rotate(0);

    }


}



/* GEÇİŞ */

.fade-away{


    opacity:0!important;


    transform:scale(1.08);


}



.paper-transition{


    position:absolute;


    inset:0;


    pointer-events:none;


    background:

    radial-gradient(

    circle,

    #fff1dc,

    transparent

    );


    opacity:0;


}



.paper-transition.active{


    animation:paperOpen 2s forwards;


}



@keyframes paperOpen{


    0%{

        opacity:0;

        transform:scale(.3);

    }



    50%{

        opacity:1;

    }



    100%{

        opacity:1;

        transform:scale(3);

    }


}


</style>


<div class="paper-transition" id="transition"></div>



<script>


const phone =
document.querySelector("#phone");

const messages =
document.querySelector("#messages");


/*
3 saniye oda izlenir
*/


setTimeout(()=>{


    phone.classList.add("show");


    const n =
    document.createElement("div");


    n.className="notification";


    n.innerHTML=
    "Umut yeni mesaj gönderdi";


    document
    .getElementById("scene")
    .appendChild(n);



    setTimeout(()=>{


        n.remove();


        startChat();


    },1800);



},3500);





function startChat(){


const texts=[

"selam :)",

"ne yapıyorsun?",

"bir süredir bir şey hazırlıyorum",

"senin için.",

"hazır mısın?"

];



texts.forEach((text,index)=>{


setTimeout(()=>{


const msg=
document.createElement("div");


msg.className="msg";


msg.innerHTML=text;


messages.appendChild(msg);



},900*index);



});



setTimeout(()=>{


document
.getElementById("file")
.classList.add("show");


},900*texts.length+500);



}




function openFile(){


document
.querySelector(".room")
.classList.add("fade-away");



document
.getElementById("phone")
.classList.add("fade-away");



document
.getElementById("transition")
.classList.add("active");



setTimeout(()=>{


/*

BURASI MEVCUT ZARF SAHNESİNE BAĞLANACAK


örnek:


window.location.href="mektup.html";


veya


document.querySelector(".intro")
.style.display="none";

document.querySelector(".site-shell")
.style.display="block";


*/


console.log(
"Zarf sahnesine geçiliyor..."
);



},1800);



}



</script>



</body>
</html>
